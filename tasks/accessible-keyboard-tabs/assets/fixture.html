<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>candidate-013 — accessible tabs</title>
    <style>body{font:16px/1.5 system-ui;margin:2rem;max-width:52rem}[role="tab"]{padding:.5rem .75rem}[role="tabpanel"]{border:1px solid #bbb;padding:1rem;margin-top:.5rem}.pass{color:#087f23}.fail{color:#b00020}</style>
  </head>
  <body>
    <h1>candidate-013: вкладки с ARIA и клавиатурой</h1>
    <p>Перемещайтесь стрелками между вкладками; активная вкладка получает фокус и меняет панель.</p>
    <div role="tablist" aria-label="Разделы">
      <button id="tab-one" role="tab" aria-controls="panel-one" aria-selected="true" tabindex="0">Первый</button>
      <button id="tab-two" role="tab" aria-controls="panel-two" aria-selected="false" tabindex="-1">Второй</button>
      <button id="tab-three" role="tab" aria-controls="panel-three" aria-selected="false" tabindex="-1">Третий</button>
    </div>
    <section id="panel-one" role="tabpanel" aria-labelledby="tab-one">Панель 1</section>
    <section id="panel-two" role="tabpanel" aria-labelledby="tab-two" hidden>Панель 2</section>
    <section id="panel-three" role="tabpanel" aria-labelledby="tab-three" hidden>Панель 3</section>
    <p id="status" aria-live="polite">Выберите вкладку.</p>
    <script>
      const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
      const panels = Array.from(document.querySelectorAll('[role="tabpanel"]'));
      const status = document.querySelector('#status');
      function activate(tab, focus = true) {
        tabs.forEach((item) => { const active = item === tab; item.setAttribute('aria-selected', String(active)); item.tabIndex = active ? 0 : -1; });
        panels.forEach((panel) => { panel.hidden = panel.id !== tab.getAttribute('aria-controls'); });
        if (focus) tab.focus();
        const selected = tabs.filter((item) => item.getAttribute('aria-selected') === 'true');
        const matchingPanel = document.getElementById(tab.getAttribute('aria-controls'));
        const pass = selected.length === 1 && matchingPanel && !matchingPanel.hidden && document.activeElement === tab;
        status.textContent = `${pass ? 'PASS' : 'FAIL'}: активна «${tab.textContent}», ARIA-связь и фокус проверены.`;
        status.className = pass ? 'pass' : 'fail';
        console.log('[candidate-013] activate', { tab: tab.id, pass });
      }
      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => activate(tab));
        tab.addEventListener('keydown', (event) => {
          if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
          activate(tabs[next]);
        });
      });
    </script>
  </body>
</html>
