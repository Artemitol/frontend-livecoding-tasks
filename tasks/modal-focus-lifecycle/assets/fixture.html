<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>candidate-014 — focus-trapped dialog</title>
    <style>body{font:16px/1.5 system-ui;margin:2rem;max-width:52rem}dialog{padding:1.25rem;min-width:24rem}.pass{color:#087f23}.fail{color:#b00020}</style>
  </head>
  <body>
    <h1>candidate-014: фокус диалога</h1>
    <p>Откройте диалог. Tab циклически удерживает фокус внутри; Escape закрывает его и возвращает фокус инициатору.</p>
    <button id="open" type="button">Открыть диалог</button>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Подтверждение</h2>
      <label>Имя <input id="name" value="Иван"></label>
      <button id="confirm" type="button">Подтвердить</button>
      <button id="close" type="button">Закрыть</button>
    </dialog>
    <p id="status" aria-live="polite">Диалог закрыт.</p>
    <script>
      const opener = document.querySelector('#open');
      const dialog = document.querySelector('#dialog');
      const status = document.querySelector('#status');
      const focusable = () => Array.from(dialog.querySelectorAll('input,button:not([disabled])'));
      function closeDialog() {
        dialog.close(); opener.focus();
        const pass = document.activeElement === opener;
        status.textContent = `${pass ? 'PASS' : 'FAIL'}: диалог закрыт, фокус возвращён инициатору.`;
        status.className = pass ? 'pass' : 'fail';
        console.log('[candidate-014] closed', { pass, activeId: document.activeElement.id });
      }
      opener.addEventListener('click', () => {
        dialog.showModal(); document.querySelector('#name').focus();
        status.textContent = 'Диалог открыт: фокус внутри.'; status.className = '';
        console.log('[candidate-014] opened', { activeId: document.activeElement.id });
      });
      document.querySelector('#close').addEventListener('click', closeDialog);
      dialog.addEventListener('cancel', (event) => { event.preventDefault(); closeDialog(); });
      dialog.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeDialog();
          return;
        }
        if (event.key !== 'Tab') return;
        const elements = focusable();
        const first = elements[0]; const last = elements[elements.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        const inside = dialog.contains(document.activeElement);
        status.textContent = `${inside ? 'PASS' : 'FAIL'}: фокус удержан внутри диалога.`;
        status.className = inside ? 'pass' : 'fail';
        console.log('[candidate-014] tab', { inside, activeId: document.activeElement.id });
      });
    </script>
  </body>
</html>
